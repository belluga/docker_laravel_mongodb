services:
  app:
    build:
      context: .
      dockerfile: ./docker/laravel-app/Dockerfile
    volumes:
      - ./laravel-app:/var/www
      - app-storage:/var/www/storage
    networks:
      - app-network

  nginx:
    build: ./docker/nginx
    env_file: .env
    ports:
      - "${NGINX_HOST_PORT_80}:80"
      - "${NGINX_HOST_PORT_443}:443"
    volumes:
      - ./laravel-app:/var/www
      - ./web-app:/var/www/flutter:ro
      - app-storage:/var/www/storage
      - certbot-data:/etc/letsencrypt
      - certbot-challenge:/var/www/certbot
    depends_on:
      - app
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - app-network
    profiles:
      - staging

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-challenge:/var/www/certbot
    env_file: .env
    command: >
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot \
        --email ${CERTBOT_EMAIL} -d ${DOMAIN} --agree-tos --no-eff-email \
        --force-renewal && \
        while true; do certbot renew; sleep 12h; done"
    profiles:
      - production

networks:
  app-network:
    driver: bridge

volumes:
  certbot-data:
  certbot-challenge:
  app-storage:
